---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tiefe Meditation</title>

  <style>
    :root {
      --bg-light: #b1d8b7;
      --green-dark: #385b4f;
      --green-very-light: #fdfefb;
      --accent-dark: #385b4f;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-light);
      color: var(--green-dark);
      line-height: 1.6;
    }

    section {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      line-height: 1.2;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    /* ---------- HEADER ---------- */

    header {
      background-color: var(--green-dark);
      color: var(--green-very-light);
      padding: 3rem 2rem;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .title-group h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .logo {
      width: 120px;
      height: auto;
    }

    /* ---------- METHODS ---------- */

    .methods-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
    }

    .method-card {
      background-color: rgba(255, 255, 255, 0.4);
      padding: 1.5rem;
      border-radius: 12px;
    }

    .method-card h3 {
      margin-bottom: 0.5rem;
    }

    /* ---------- PRINCIPLES ---------- */

    .principles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }

    .principle {
      padding: 1.5rem;
      border-left: 4px solid var(--accent-dark);
    }

    .principle h3 {
      margin-bottom: 0.75rem;
    }
    /* ---------- SERVICES ---------- */

    .services-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
    }

    .service {
      background-color: var(--green-dark);
      color: var(--green-very-light);
      padding: 2rem;
      border-radius: 14px;
    }

    .service h3 {
      margin-bottom: 0.5rem;
    }

    .price {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 1rem 0;
    }

    /* ---------- ABOUT ---------- */

    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }

    .about-photo {
      width: 40%;
      max-width: 400px;   /* optional */
      border-radius: 16px;
      justify-self: end;
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 900px) {
      .methods-grid,
      .principles-grid,
      .services-list,
      .about {
        grid-template-columns: 1fr;
      }

      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* ---------- FOOTER ---------- */

    footer {
      background-color: var(--green-dark);
      color: var(--green-very-light);
      padding: 2rem;
      margin-top: 4rem;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-content a {
      color: var(--green-very-light);
      text-decoration: none;
      border-bottom: 1px solid rgba(253, 254, 251, 0.4);
    }

    .footer-content a:hover {
      border-bottom-color: var(--green-very-light);
    }
    
    /* ---------- SERVICE HOVER CTA ---------- */

    .service {
      position: relative;
      overflow: hidden;
    }

    .service-cta {
      position: absolute;
      inset: 0;
      background-color: rgba(56, 91, 79, 0.95); /* dark green overlay */
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .service:hover .service-cta {
      opacity: 1;
    }

    .service-cta a {
      background-color: var(--green-very-light);
      color: var(--green-dark);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .service-cta a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    /* ----------------- EVENTS ------------ */
    .events-grid {
      display: grid;
      gap: 2rem;
    }

    .event-card {
      background-color: rgba(255, 255, 255, 0.4);
      padding: 1.5rem;
      border-radius: 12px;
    }

    .event-card h3 {
      margin-bottom: 0.5rem;
    }

    .event-meta {
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      opacity: 0.8;
    }

    .event-card a {
      display: inline-block;
      margin-top: 1rem;
      background-color: var(--green-dark);
      color: var(--green-very-light);
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      text-decoration: none;
    }
  </style>
</head>

<body>
    {{ content }}
</body>
</html>
